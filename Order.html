<body>

  <style>
    {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Montserrat', sans-serif;
  background-color: #d3f075; 
  color: #383b2f;
  line-height: 1.6;
}


header {
  text-align: center;
  padding: 20px;
}

header h1 {
  font-weight: 800;
  font-size: 2.2em;
  color: #383b2f;
  margin-bottom: 15px;
}

header img {
  width: 100%;
  max-height: 400px;
  object-fit: cover;
  border-radius: 10px;
}


nav {
  background-color: #f5d7a6; 
}

nav ul {
  list-style: none;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

nav ul li {
  position: relative;
}

nav ul li a {
  display: block;
  padding: 12px 18px;
  text-decoration: none;
  color: white;
  font-weight: 600;
  transition: background 0.3s;
}

nav ul li a:hover {
  background-color: #f5d7a6;
  border-radius: 6px;
}


nav ul li ul.dropdown {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  background-color: #0A1F44;
  border-radius: 6px;
  min-width: 180px;
  flex-direction: column;
  z-index: 1000;
}

nav ul li:hover ul.dropdown {
  display: flex;
  flex-direction: column;
}

nav ul li ul.dropdown li a {
  padding: 10px 16px;
  font-weight: 500;
}

nav ul li ul.dropdown li a:hover {
  background-color: #1a3b6e;
}


.content {
  text-align: center;
  padding: 40px;
  max-width: 900px;
  margin: auto;
}


footer {
  background-color: #f5d7a6;
  color: white;
  text-align: center;
  padding: 15px;
  margin-top: 40px;
}

    body {
      padding: 0;
      margin: 0;
      background-color: #f2f7e6; /* greenish background like product pages */
      font-family: 'Montserrat', sans-serif;
    }

    .order-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 40px;
      margin-bottom: 40px;
    }

    /* WHITE CARD STYLE LIKE PRODUCT PAGE */
    .container {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 30px;
      max-width: 750px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
      border: 3px solid #e3f3ab; /* green-yellow accent */
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      color: #2e3a1f;
      margin-bottom: 20px;
    }

    .user-details .input-box input {
      height: 45px;
      width: 100%;
      outline: none;
      font-size: 16px;
      border-radius: 8px;
      padding-left: 15px;
      border: 2px solid #d6eba0;
      background-color: white;
      transition: 0.3s;
    }

    .user-details .input-box input:focus {
      border-color: #b7db63;
    }

    .gender-title {
      font-size: 18px;
      margin-top: 10px;
      font-weight: 600;
    }

    .dot {
      background: #e8e4cf;
    }

    #dot-1:checked ~ .category label .one,
    #dot-2:checked ~ .category label .two,
    #dot-3:checked ~ .category label .three {
      background: #b7db63;
      border-color: #eaffc2;
    }

    .button input {
      height: 45px;
      width: 100%;
      border-radius: 8px;
      border: none;
      color: white;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      background-color: #2e3a1f;
      transition: 0.3s;
    }

    .button input:hover {
      background-color: #445b2b;
    }
  </style>

  <div class="banner">
    <img src="Order.gif" alt="Order Banner" />
  </div>

          <li><a href="Men.html">Men</a></li>

          <li><a href="Shop Icons & By Sport.html">Shop Icons & By Sport</a></li>

    </ul>

  <div class="order-wrapper">
  <div class="container">
    <div class="title">Order Form</div>
    <div class="content">
      <form action="#">
        <div class="user-details">
          <div class="input-box">
            <span class="details">Full Name</span>
            <input type="text" placeholder="Enter your name" required>
          </div>
          <div class="input-box">
            <span class="details">Email</span>
            <input type="email" placeholder="Enter your email" required>
          </div>
          <div class="input-box">
            <span class="details">Phone Number</span>
            <input type="text" placeholder="Enter your number" required>
          </div>
          <div class="input-box">
            <span class="details">Address</span>
            <input type="text" placeholder="Enter your address" required>
          </div>
          <div class="input-box">
            <span class="details">Product Name</span>
            <input type="text" placeholder="Enter product name" required>
          </div>
          <div class="input-box">
            <span class="details">Size</span>
            <input type="text" placeholder="Example: 40, 41, 42" required>
          </div>
        </div>

        <div class="gender-details">
          <span class="gender-title">Payment Method</span>
          <div class="category">
            <label for="dot-1">
              <span class="dot one"></span>
              <span class="gender">Bank Transfer</span>
            </label>
            <label for="dot-2">
              <span class="dot two"></span>
              <span class="gender">COD</span>
            </label>
            <label for="dot-3">
              <span class="dot three"></span>
              <span class="gender">E-Wallet</span>
            </label>
          </div>
        </div>

        <div class="button">
          <input type="submit" value="Submit Order">
        </div>
      </form>
    </div>
  </div>
