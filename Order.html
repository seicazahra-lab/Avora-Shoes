<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avora Shoes - Order</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      padding: 0;
      margin: 0;
      background-color: #d3f075; /* pastel yellow matching layout.css */
      font-family: 'Montserrat', sans-serif;
      color: #383b2f;
    }

    .order-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 40px;
      margin-bottom: 40px;
    }

    .container {
      background-color: #fff7d6; /* soft pastel cream */
      border-radius: 10px;
      padding: 25px 30px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
      max-width: 700px;
    }

    .title {
      font-size: 25px;
      font-weight: 700;
      color: #383b2f;
      border-bottom: 3px solid #f5d7a6;
      width: fit-content;
      margin-bottom: 10px;
    }

    .user-details .input-box input {
      height: 45px;
      width: 100%;
      outline: none;
      font-size: 16px;
      border-radius: 5px;
      padding-left: 15px;
      border: 2px solid #f5d7a6;
      background-color: #fff;
      color: #383b2f;
      transition: 0.3s;
    }

    .user-details .input-box input:focus {
      border-color: #e0b878;
    }

    .gender-title {
      font-size: 18px;
      margin-top: 10px;
      font-weight: 600;
      color: #383b2f;
    }

    .dot {
      background: #e8e4cf;
    }

    #dot-1:checked ~ .category label .one,
    #dot-2:checked ~ .category label .two,
    #dot-3:checked ~ .category label .three {
      background: #f5d7a6;
      border-color: #fff1d0;
    }

    .button input {
      height: 45px;
      width: 100%;
      border-radius: 5px;
      border: none;
      color: #383b2f;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      background-color: #f5d7a6;
      transition: 0.3s;
    }

    .button input:hover {
      background-color: #e8c38f;
    }
  </style>
</head>
<body>

  <style>
    body {
      padding: 0;
      margin: 0;
      background: linear-gradient(135deg, #71b7e6, #9b59b6);
      font-family: 'Poppins', sans-serif;
    }
    .order-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 40px;
      margin-bottom: 40px;
    }
  </style>

  <div class="banner">
    <img src="Order.gif" alt="Order Banner" />
  </div>

  <nav>
    <ul>
      <li><a href="index.html" target="_blank">Home</a></li>
      <li><a href="Profile.html">Profile</a></li>
      <li>
        <a href="#">All Product</a>
        <ul class="dropdown">
          <li><a href="Men.html">Men</a></li>
          <li><a href="Women.html">Women</a></li>
          <li><a href="Kids.html">Kids</a></li>
          <li><a href="Shop Icons & By Sport.html">Shop Icons & By Sport</a></li>
        </ul>
      </li>
      <li><a href="Sale.html">Sale</a></li>
      <li><a href="Bag.html">Bag</a></li>
      <li><a href="Order.html">Order</a></li>
    </ul>
  </nav>

  <div class="order-wrapper">
  <div class="container">
    <div class="title">Order Form</div>
    <div class="content">
      <form action="#">
        <div class="user-details">
          <div class="input-box">
            <span class="details">Full Name</span>
            <input type="text" placeholder="Enter your name" required>
          </div>
          <div class="input-box">
            <span class="details">Email</span>
            <input type="email" placeholder="Enter your email" required>
          </div>
          <div class="input-box">
            <span class="details">Phone Number</span>
            <input type="text" placeholder="Enter your number" required>
          </div>
          <div class="input-box">
            <span class="details">Address</span>
            <input type="text" placeholder="Enter your address" required>
          </div>
          <div class="input-box">
            <span class="details">Product Name</span>
            <input type="text" placeholder="Enter product name" required>
          </div>
          <div class="input-box">
            <span class="details">Size</span>
            <input type="text" placeholder="Example: 40, 41, 42" required>
          </div>
        </div>

        <div class="gender-details">
          <span class="gender-title">Payment Method</span>
          <div class="category">
            <label for="dot-1">
              <span class="dot one"></span>
              <span class="gender">Bank Transfer</span>
            </label>
            <label for="dot-2">
              <span class="dot two"></span>
              <span class="gender">COD</span>
            </label>
            <label for="dot-3">
              <span class="dot three"></span>
              <span class="gender">E-Wallet</span>
            </label>
          </div>
        </div>

        <div class="button">
          <input type="submit" value="Submit Order">
        </div>
      </form>
    </div>
  </div>


  <footer>
    <p>Copyright © 2025 by SEICA-IF1</p>
  </footer>

</body>
</html>
